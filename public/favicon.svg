<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Greenbit">
  <defs>
    <linearGradient id="gb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BA368"/>
      <stop offset="1" stop-color="#1C5E3D"/>
    </linearGradient>
    <linearGradient id="gb-leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D9F2E1"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#gb-bg)"/>
  <!-- stem -->
  <path d="M256 384 C256 330 254 290 262 236" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  <!-- left leaf -->
  <path d="M252 300 C200 304 142 276 124 206 C190 196 240 226 252 300 Z" fill="url(#gb-leaf)"/>
  <!-- right leaf -->
  <path d="M262 240 C268 170 318 112 402 108 C404 190 348 240 262 240 Z" fill="url(#gb-leaf)"/>
  <!-- leaf veins -->
  <path d="M246 292 C214 270 182 246 150 214" fill="none" stroke="#3BA368" stroke-width="7" stroke-linecap="round" opacity=".55"/>
  <path d="M270 232 C310 204 344 170 380 130" fill="none" stroke="#3BA368" stroke-width="7" stroke-linecap="round" opacity=".55"/>
  <!-- the bit -->
  <rect x="220" y="372" width="72" height="72" rx="16" fill="#F4BE4F"/>
  <rect x="220" y="372" width="72" height="24" rx="12" fill="#FFD77F" opacity=".7"/>
</svg>
